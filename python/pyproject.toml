[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiadesk"
version = "0.1.0"
description = "Drive GaiaDesk desks from Python: devices, exec, shell, file copy, background jobs, stats, scoped tokens and MCP, through gaiadesk-cli."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["gaiadesk", "remote-desktop", "sdk", "exec", "mcp", "ai-agents"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://gaiadesk.net/docs/cli-for-agents"
Download = "https://gaiadesk.net/download"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaiadesk = ["py.typed"]
